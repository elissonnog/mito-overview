[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mito-overview"
version = "0.3.0"
description = "Mode-gated mitochondrial DNA evidence reporting workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Elisson Lopes" },
  { name = "Xiaowu Gai" }
]
dependencies = [
  "biopython==1.87",
  "matplotlib==3.11.0",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "pysam==0.24.0",
  "requests==2.34.2"
]
keywords = [
  "mitochondrial DNA",
  "mtDNA",
  "Oxford Nanopore",
  "bioinformatics",
  "workflow",
  "heteroplasmy",
  "report generation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.optional-dependencies]
human = []
dev = ["build==1.5.0", "pytest==9.1.1", "python-docx==1.2.0"]

[project.scripts]
mito-overview = "mito_overview.cli:main"

[project.urls]
Repository = "https://github.com/elissonnog/mito-overview"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mito_overview*"]
namespaces = false

[tool.setuptools.data-files]
"share/mito-overview/schemas" = ["resources/schemas/mito_overview_config.schema.yaml"]
"share/mito-overview/annotations" = [
  "resources/annotations/human_mt_reference.gtf",
  "resources/annotations/NC_012920.1.fa"
]
"share/mito-overview/locks" = [
  "locks/environment-linux-64.yml",
  "locks/environment-osx-64.yml",
  "locks/environment-osx-arm64.yml",
  "locks/environment-linux-64.explicit.txt",
  "locks/environment-osx-64.explicit.txt",
  "locks/environment-osx-arm64.explicit.txt",
  "locks/requirements-release-tools.txt"
]
