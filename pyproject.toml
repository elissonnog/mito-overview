[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mito-overview"
version = "0.2.0"
description = "Mode-gated mitochondrial DNA evidence reporting workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Elisson Lopes, PhD" }
]
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pysam>=0.22",
  "requests>=2.32"
]
keywords = [
  "mitochondrial DNA",
  "mtDNA",
  "Oxford Nanopore",
  "bioinformatics",
  "workflow",
  "heteroplasmy",
  "report generation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.optional-dependencies]
human = []
dev = ["pytest>=8.0"]

[project.scripts]
mito-overview = "mito_overview.cli:main"
