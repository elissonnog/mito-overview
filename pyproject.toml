[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mito-overview"
version = "0.3.0"
description = "Mode-gated mitochondrial DNA evidence reporting workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Elisson Lopes" },
  { name = "Xiaowu Gai" }
]
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "pysam>=0.22",
  "requests>=2.32"
]
keywords = [
  "mitochondrial DNA",
  "mtDNA",
  "Oxford Nanopore",
  "bioinformatics",
  "workflow",
  "heteroplasmy",
  "report generation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.optional-dependencies]
human = []
dev = ["pytest>=8.0", "python-docx>=1.1"]

[project.scripts]
mito-overview = "mito_overview.cli:main"

[project.urls]
Repository = "https://github.com/elissonnog/mito-overview"

[tool.setuptools.packages.find]
include = ["mito_overview*"]
namespaces = false

[tool.setuptools.data-files]
"share/mito-overview/schemas" = ["resources/schemas/mito_overview_config.schema.yaml"]
